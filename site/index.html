<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream 18.11 · Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">Stream 18.11<span class="u">_</span></div>
      <nav class="tabs" aria-label="Demo mode">
        <a href="?mode=realtime" data-mode="realtime">Database + Realtime</a>
        <a href="?mode=stream" data-mode="stream">Streamed response</a>
        <a href="?mode=both" data-mode="both">Side by side</a>
      </nav>
    </header>

    <main id="panels"></main>

    <form id="composer" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="row">
        <input id="prompt" name="prompt" placeholder="Ask anything…" aria-label="Message" />
        <button type="submit" id="send">Send</button>
      </div>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
